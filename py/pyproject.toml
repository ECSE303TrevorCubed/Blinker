[project]
name = "blink"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "rpi-lgpio>=0.6",
]

[project.scripts]
blink = "blink:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[tool.basedpyright]
extraPaths = ["."]
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
ignore = [
  "typings",
  "nix/store",
  ".direnv",
]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.venv",
  "**/.*"
]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "rpi-lgpio>=0.6",
]
